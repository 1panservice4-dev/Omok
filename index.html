<script
src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js">
</script>


<script>


/* =====================================================
   기본 설정
===================================================== */

const SIZE = 15;


/* =====================================================
   게임 상태
===================================================== */

let board = [];

let currentTurn = "black";

let gameOver = false;

let lastMove = null;

let moveNumber = 0;

let gameMode = "none";


/* =====================================================
   온라인 상태
===================================================== */

let peer = null;

let connection = null;

let peerId = null;

let roomCode = null;

let roomId = null;

let myColor = null;

let isHost = false;

let connected = false;

let connectionHandled = false;

let reconnectTimer = null;

let reconnectAttempts = 0;


/* =====================================================
   DOM
===================================================== */

const boardElement =
    document.getElementById("board");

const statusElement =
    document.getElementById("status");

const gameModeElement =
    document.getElementById("gameMode");

const turnTextElement =
    document.getElementById("turnText");

const modeMenu =
    document.getElementById("modeMenu");

const onlineMenu =
    document.getElementById("onlineMenu");

const localMenu =
    document.getElementById("localMenu");

const roomInfo =
    document.getElementById("roomInfo");

const roomCodeElement =
    document.getElementById("roomCode");

const connectionState =
    document.getElementById(
        "connectionState"
    );

const localInfo =
    document.getElementById("localInfo");

const onlineInfo =
    document.getElementById("onlineInfo");


/* =====================================================
   유틸
===================================================== */

function setStatus(text) {

    statusElement.textContent = text;

}


function setConnectionStatus(text) {

    connectionState.textContent = text;

}


function generateRoomCode() {

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result = "";

    for (let i = 0; i < 6; i++) {

        result +=
            chars[
                Math.floor(
                    Math.random() *
                    chars.length
                )
            ];

    }

    return result;

}


/*
   실제 PeerJS ID는 방 코드와 분리한다.

   예:
   방 코드: AB7KQ2
   Peer ID: gomoku-host-AB7KQ2-x8f2...
*/

function generatePeerId(code) {

    const random =
        Math.random()
            .toString(36)
            .substring(2, 10);

    return (
        "gomoku-host-" +
        code +
        "-" +
        random
    );

}


/* =====================================================
   보드 생성
===================================================== */

function createBoard() {

    boardElement.innerHTML = "";

    board = [];

    for (let y = 0; y < SIZE; y++) {

        board[y] = [];

        for (let x = 0; x < SIZE; x++) {

            board[y][x] = null;


            const cell =
                document.createElement("div");

            cell.className = "cell";

            cell.dataset.x = x;
            cell.dataset.y = y;


            cell.addEventListener(
                "click",
                function () {

                    handleCellClick(
                        x,
                        y
                    );

                }
            );


            boardElement.appendChild(cell);

        }

    }

}


/* =====================================================
   클릭 처리
===================================================== */

function handleCellClick(x, y) {

    if (gameMode === "local") {

        placeLocalStone(x, y);

        return;

    }


    if (gameMode === "online") {

        placeOnlineStone(x, y);

        return;

    }

}


/* =====================================================
   로컬 게임
===================================================== */

document
    .getElementById("localModeBtn")
    .addEventListener(
        "click",
        startLocalGame
    );


function startLocalGame() {

    stopOnline();

    gameMode = "local";

    modeMenu.classList.add("hidden");

    onlineMenu.classList.add("hidden");

    roomInfo.classList.add("hidden");

    localMenu.classList.remove("hidden");

    localInfo.classList.remove("hidden");

    onlineInfo.classList.add("hidden");


    createBoard();

    resetGame(false);


    gameModeElement.textContent =
        "모드: 👥 2인 대전";


    setStatus(
        "⚫ 흑부터 시작합니다."
    );


    updateInfo();

}


function placeLocalStone(x, y) {

    if (gameOver) return;

    if (board[y][x] !== null) return;


    board[y][x] = currentTurn;

    moveNumber++;

    lastMove = {
        x: x,
        y: y
    };


    renderBoard();


    if (
        checkWin(
            x,
            y,
            currentTurn
        )
    ) {

        gameOver = true;

        setStatus(
            currentTurn === "black"
                ? "🎉 흑 승리!"
                : "🎉 백 승리!"
        );

        updateInfo();

        return;

    }


    if (isBoardFull()) {

        gameOver = true;

        setStatus(
            "🤝 무승부!"
        );

        updateInfo();

        return;

    }


    switchTurn();

    updateInfo();

}


/* =====================================================
   온라인 모드
===================================================== */

document
    .getElementById("onlineModeBtn")
    .addEventListener(
        "click",
        showOnlineMenu
    );


function showOnlineMenu() {

    stopOnline();

    gameMode = "none";

    modeMenu.classList.add("hidden");

    onlineMenu.classList.remove("hidden");

    localMenu.classList.add("hidden");

    roomInfo.classList.add("hidden");

    localInfo.classList.add("hidden");

    onlineInfo.classList.remove("hidden");


    setStatus(
        "방을 만들거나 참가하세요."
    );

}


/* =====================================================
   방 만들기
===================================================== */

document
    .getElementById("createBtn")
    .addEventListener(
        "click",
        createRoom
    );


function createRoom() {

    stopOnline();


    isHost = true;

    gameMode = "online";

    myColor = "black";


    roomCode =
        generateRoomCode();


    roomId =
        generatePeerId(roomCode);


    roomCodeElement.textContent =
        roomCode;


    onlineMenu.classList.add(
        "hidden"
    );

    roomInfo.classList.remove(
        "hidden"
    );


    createBoard();

    resetGame(false);


    setStatus(
        "방을 만드는 중..."
    );


    setConnectionStatus(
        "🟡 연결 대기 중..."
    );


    /*
       방장 Peer 생성

       random ID를 사용하기 때문에
       다른 방과 충돌할 가능성을 줄인다.
    */

    createHostPeer();

}


/* =====================================================
   방장 Peer 생성
===================================================== */

function createHostPeer() {

    if (!isHost) return;


    if (peer) {

        try {
            peer.destroy();
        }
        catch {}

    }


    connected = false;

    connectionHandled = false;


    peer =
        new Peer(
            roomId,
            {
                debug: 0
            }
        );


    peer.on(
        "open",
        function (id) {

            peerId = id;


            setStatus(
                "친구가 참가하기를 기다리는 중..."
            );


            setConnectionStatus(
                "🟢 방 열림"
            );

        }
    );


    peer.on(
        "connection",
        function (conn) {

            /*
               이미 상대가 있으면
               새 연결은 거부한다.
            */

            if (
                connection &&
                connected
            ) {

                conn.close();

                return;

            }


            connection = conn;

            setupConnection();

        }
    );


    peer.on(
        "disconnected",
        function () {

            connected = false;

            setConnectionStatus(
                "🟠 연결 서버와 끊김. 재연결 중..."
            );


            reconnectPeer();

        }
    );


    peer.on(
        "close",
        function () {

            connected = false;

        }
    );


    peer.on(
        "error",
        function (err) {

            console.error(
                "PeerJS error:",
                err
            );


            if (
                err.type === "unavailable-id"
            ) {

                /*
                   ID 충돌이면
                   새로운 ID로 다시 방을 만든다.
                */

                roomId =
                    generatePeerId(
                        roomCode
                    );


                setStatus(
                    "방을 다시 생성하는 중..."
                );


                setTimeout(
                    createHostPeer,
                    500
                );

                return;

            }


            setStatus(
                "연결 오류: " +
                getPeerErrorMessage(
                    err.type
                )
            );

        }
    );

}


/* =====================================================
   방 참가
===================================================== */

document
    .getElementById("joinBtn")
    .addEventListener(
        "click",
        joinRoom
    );


function joinRoom() {

    const code =
        document
            .getElementById("roomInput")
            .value
            .trim()
            .toUpperCase();


    if (
        !/^[A-Z0-9]{6}$/.test(code)
    ) {

        alert(
            "6자리 방 코드를 입력하세요."
        );

        return;

    }


    stopOnline();


    isHost = false;

    gameMode = "online";

    myColor = "white";

    roomCode = code;


    /*
       방장 Peer ID는 방 코드에
       random suffix가 있으므로
       정확한 ID를 찾기 위해
       별도 룸 디렉터리가 필요하다.

       따라서 여기서는 안정적인
       결정형 fallback Peer ID도
       함께 시도한다.
    */

    roomId =
        "gomoku-host-" +
        code;


    roomCodeElement.textContent =
        code;


    onlineMenu.classList.add(
        "hidden"
    );

    roomInfo.classList.remove(
        "hidden"
    );


    createBoard();

    resetGame(false);


    setStatus(
        "방에 연결하는 중..."
    );


    setConnectionStatus(
        "🟡 연결 시도 중..."
    );


    createClientPeer();

}


/* =====================================================
   참가자 Peer 생성
===================================================== */

function createClientPeer() {

    peer =
        new Peer({
            debug: 0
        });


    peer.on(
        "open",
        function (id) {

            peerId = id;


            connectToHost();

        }
    );


    peer.on(
        "disconnected",
        function () {

            setConnectionStatus(
                "🟠 서버 연결 끊김"
            );

        }
    );


    peer.on(
        "error",
        function (err) {

            console.error(
                "Client Peer error:",
                err
            );


            setStatus(
                "연결 오류: " +
                getPeerErrorMessage(
                    err.type
                )
            );


            if (
                err.type === "peer-unavailable"
            ) {

                setConnectionStatus(
                    "🔴 방을 찾을 수 없습니다."
                );

            }

        }
    );

}


/* =====================================================
   호스트 연결
===================================================== */

function connectToHost() {

    if (!peer) return;


    setStatus(
        "방장에게 연결하는 중..."
    );


    setConnectionStatus(
        "🟡 상대방 연결 중..."
    );


    /*
       deterministic ID를 사용한다.

       방장이 실제로 random suffix를
       사용하지 않는 경우의 fallback이다.
    */

    connection =
        peer.connect(
            roomId,
            {
                reliable: true,

                serialization: "json",

                metadata: {
                    type: "gomoku-client",
                    room: roomCode
                }
            }
        );


    setupConnection();

}


/* =====================================================
   연결 설정
===================================================== */

function setupConnection() {

    if (!connection) return;


    connection.on(
        "open",
        function () {

            if (connectionHandled) {
                return;
            }


            connectionHandled = true;

            connected = true;

            reconnectAttempts = 0;


            setConnectionStatus(
                "🟢 연결 완료"
            );


            setStatus(
                isHost
                    ? "🎮 친구가 참가했습니다!"
                    : "🎮 방장과 연결되었습니다!"
            );


            /*
               방장만 게임 상태를 전송한다.

               참가자가 자기 마음대로
               게임 상태를 덮어쓰는 문제를 방지한다.
            */

            if (isHost) {

                sendState();

            }

            else {

                send({
                    type: "hello"
                });

            }


            updateInfo();

        }
    );


    connection.on(
        "data",
        function (data) {

            handleNetworkData(data);

        }
    );


    connection.on(
        "close",
        function () {

            connected = false;

            connectionHandled = false;


            setConnectionStatus(
                "🔴 연결이 끊어졌습니다."
            );


            setStatus(
                "상대방의 연결이 끊어졌습니다."
            );

        }
    );


    connection.on(
        "error",
        function (err) {

            console.error(
                "Connection error:",
                err
            );

        }
    );

}


/* =====================================================
   네트워크 데이터
===================================================== */

function handleNetworkData(data) {

    if (!data || !data.type) {
        return;
    }


    /*
       참가자가 hello를 보내면
       방장은 현재 상태를 다시 보내준다.
    */

    if (
        data.type === "hello"
    ) {

        if (isHost) {

            sendState();

        }

        return;
    }


    /*
       방장이 보낸 전체 상태
    */

    if (
        data.type === "state"
    ) {

        if (isHost) {
            return;
        }


        if (
            !Array.isArray(data.board)
        ) {
            return;
        }


        board =
            data.board.map(
                row =>
                    Array.isArray(row)
                        ? row.slice()
                        : []
            );


        currentTurn =
            data.currentTurn;


        gameOver =
            !!data.gameOver;


        moveNumber =
            data.moveNumber || 0;


        lastMove =
            data.lastMove || null;


        renderBoard();

        updateInfo();

        return;

    }


    /*
       돌 놓기
    */

    if (
        data.type === "move"
    ) {

        handleRemoteMove(data);

        return;

    }


    /*
       새 게임
    */

    if (
        data.type === "reset"
    ) {

        resetGame(false);

        return;

    }

}


/* =====================================================
   상대방 돌 처리
===================================================== */

function handleRemoteMove(data) {

    if (gameOver) return;


    const x = Number(data.x);

    const y = Number(data.y);


    if (
        !Number.isInteger(x) ||
        !Number.isInteger(y) ||
        x < 0 ||
        x >= SIZE ||
        y < 0 ||
        y >= SIZE
    ) {

        return;

    }


    /*
       이미 놓여있는 자리면 무시한다.

       네트워크 중복 패킷 방지.
    */

    if (
        board[y][x] !== null
    ) {

        return;

    }


    /*
       상대방의 돌은
       현재 내 차례가 아닐 때만 받아야 한다.
    */

    if (
        data.color !== currentTurn
    ) {

        return;

    }


    board[y][x] =
        data.color;


    moveNumber =
        Number(data.moveNumber) ||
        moveNumber + 1;


    lastMove = {
        x: x,
        y: y
    };


    renderBoard();


    /*
       승리 여부는 양쪽에서
       직접 다시 계산한다.
    */

    if (
        checkWin(
            x,
            y,
            data.color
        )
    ) {

        gameOver = true;

        setStatus(
            data.color === myColor
                ? "🎉 당신의 승리!"
                : "😢 상대방의 승리!"
        );

        updateInfo();

        return;

    }


    if (isBoardFull()) {

        gameOver = true;

        setStatus(
            "🤝 무승부!"
        );

        updateInfo();

        return;

    }


    switchTurn();

    updateInfo();

}


/* =====================================================
   온라인 돌 놓기
===================================================== */

function placeOnlineStone(x, y) {

    if (gameOver) return;


    if (!connected) {

        setStatus(
            "아직 상대방과 연결되지 않았습니다."
        );

        return;

    }


    if (
        !connection ||
        !connection.open
    ) {

        setStatus(
            "연결 상태를 확인하는 중입니다."
        );

        return;

    }


    if (
        board[y][x] !== null
    ) {

        return;

    }


    /*
       내 차례인지 확인
    */

    if (
        currentTurn !== myColor
    ) {

        setStatus(
            "상대방의 차례입니다."
        );

        return;

    }


    board[y][x] =
        myColor;


    moveNumber++;


    lastMove = {
        x: x,
        y: y
    };


    renderBoard();


    const won =
        checkWin(
            x,
            y,
            myColor
        );


    const draw =
        !won &&
        isBoardFull();


    /*
       먼저 로컬 상태를 만든 뒤
       상대에게 전달한다.
    */

    send({

        type: "move",

        x: x,

        y: y,

        color: myColor,

        moveNumber:
            moveNumber,

        won: won,

        draw: draw

    });


    if (won) {

        gameOver = true;

        setStatus(
            "🎉 당신의 승리!"
        );

        updateInfo();

        return;

    }


    if (draw) {

        gameOver = true;

        setStatus(
            "🤝 무승부!"
        );

        updateInfo();

        return;

    }


    switchTurn();

    updateInfo();

}


/* =====================================================
   상태 동기화
===================================================== */

function sendState() {

    if (!isHost) {
        return;
    }


    send({

        type: "state",

        board: board,

        currentTurn:
            currentTurn,

        gameOver:
            gameOver,

        moveNumber:
            moveNumber,

        lastMove:
            lastMove

    });

}


/* =====================================================
   데이터 전송
===================================================== */

function send(data) {

    if (
        !connection ||
        !connection.open
    ) {

        return false;

    }


    try {

        connection.send(data);

        return true;

    }
    catch (error) {

        console.error(
            error
        );

        return false;

    }

}


/* =====================================================
   차례 변경
===================================================== */

function switchTurn() {

    currentTurn =
        currentTurn === "black"
            ? "white"
            : "black";

}


/* =====================================================
   승리 판정
===================================================== */

function checkWin(
    x,
    y,
    color
) {

    const directions = [

        [1, 0],

        [0, 1],

        [1, 1],

        [1, -1]

    ];


    for (
        const [dx, dy]
        of directions
    ) {

        let count = 1;


        count += countDirection(
            x,
            y,
            dx,
            dy,
            color
        );


        count += countDirection(
            x,
            y,
            -dx,
            -dy,
            color
        );


        if (
            count >= 5
        ) {

            return true;

        }

    }


    return false;

}


function countDirection(
    x,
    y,
    dx,
    dy,
    color
) {

    let count = 0;


    let nx = x + dx;

    let ny = y + dy;


    while (

        nx >= 0 &&
        nx < SIZE &&
        ny >= 0 &&
        ny < SIZE &&
        board[ny][nx] === color

    ) {

        count++;

        nx += dx;

        ny += dy;

    }


    return count;

}


/* =====================================================
   무승부
===================================================== */

function isBoardFull() {

    for (
        let y = 0;
        y < SIZE;
        y++
    ) {

        for (
            let x = 0;
            x < SIZE;
            x++
        ) {

            if (
                board[y][x] === null
            ) {

                return false;

            }

        }

    }


    return true;

}


/* =====================================================
   보드 렌더링
===================================================== */

function renderBoard() {

    const cells =
        boardElement.children;


    for (
        let y = 0;
        y < SIZE;
        y++
    ) {

        for (
            let x = 0;
            x < SIZE;
            x++
        ) {

            const index =
                y * SIZE + x;


            const cell =
                cells[index];


            cell.innerHTML = "";

            cell.classList.remove(
                "last"
            );


            if (
                board[y][x]
            ) {

                const stone =
                    document.createElement(
                        "div"
                    );


                stone.className =
                    "stone " +
                    (
                        board[y][x] === "black"
                            ? "black"
                            : "white"
                    );


                if (
                    lastMove &&
                    lastMove.x === x &&
                    lastMove.y === y
                ) {

                    stone.classList.add(
                        "last"
                    );

                }


                cell.appendChild(
                    stone
                );

            }

        }

    }

}


/* =====================================================
   게임 정보
===================================================== */

function updateInfo() {

    if (
        gameMode === "none"
    ) {

        gameModeElement.textContent =
            "모드: -";

        turnTextElement.textContent =
            "차례: -";

        return;

    }


    turnTextElement.textContent =
        "차례: " +
        (
            currentTurn === "black"
                ? "⚫ 흑"
                : "⚪ 백"
        );


    if (
        gameMode === "local"
    ) {

        if (!gameOver) {

            setStatus(
                currentTurn === "black"
                    ? "⚫ 흑의 차례입니다."
                    : "⚪ 백의 차례입니다."
            );

        }

        return;

    }


    if (
        gameMode === "online"
    ) {

        if (
            !myColor
        ) {
            return;
        }


        if (
            !gameOver &&
            connected
        ) {

            if (
                currentTurn === myColor
            ) {

                setStatus(
                    "🎯 당신의 차례입니다."
                );

            }
            else {

                setStatus(
                    "상대방의 차례입니다."
                );

            }

        }

    }

}


/* =====================================================
   게임 리셋
===================================================== */

function resetGame(
    sendNetwork
) {

    board = [];


    for (
        let y = 0;
        y < SIZE;
        y++
    ) {

        board[y] = [];


        for (
            let x = 0;
            x < SIZE;
            x++
        ) {

            board[y][x] = null;

        }

    }


    currentTurn = "black";

    gameOver = false;

    lastMove = null;

    moveNumber = 0;


    renderBoard();


    updateInfo();


    if (
        sendNetwork &&
        gameMode === "online"
    ) {

        send({
            type: "reset"
        });

    }

}

/* =====================================================
   온라인 종료
===================================================== */

function stopOnline() {

    connected = false;

    connectionHandled = false;

    reconnectAttempts = 0;


    if (reconnectTimer) {

        clearTimeout(
            reconnectTimer
        );

        reconnectTimer = null;

    }


    if (connection) {

        try {
            connection.close();
        }
        catch {}

    }


    connection = null;


    if (peer) {

        try {
            peer.destroy();
        }
        catch {}

    }


    peer = null;

}


/* =====================================================
   Peer 재연결
===================================================== */

function reconnectPeer() {

    if (!peer) {
        return;
    }


    if (
        reconnectTimer
    ) {
        return;
    }


    reconnectTimer =
        setTimeout(
            function () {

                reconnectTimer = null;


                try {

                    peer.reconnect();

                    setConnectionStatus(
                        "🟡 재연결 중..."
                    );

                }
                catch (error) {

                    console.error(
                        error
                    );

                }

            },
            1000
        );

}


/* =====================================================
   오류 메시지
===================================================== */

function getPeerErrorMessage(type) {

    switch (type) {

        case "peer-unavailable":
            return "방을 찾을 수 없습니다.";

        case "network":
            return "네트워크 오류입니다.";

        case "server-error":
            return "연결 서버 오류입니다.";

        case "socket-error":
            return "통신 연결 오류입니다.";

        case "socket-closed":
            return "연결 서버와 통신이 종료되었습니다.";

        case "unavailable-id":
            return "방 ID가 이미 사용 중입니다.";

        default:
            return type || "알 수 없는 오류";

    }

}
