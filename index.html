<!-- PeerJS -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>


<script>

const SIZE = 15;


// =====================================
// 상태
// =====================================

let board = [];

let currentTurn = "black";

let gameOver = false;

let lastMove = null;


// 게임 모드
// "none"
// "local"
// "online"

let gameMode = "none";


// =====================================
// 온라인 상태
// =====================================

let peer = null;

let connection = null;

let roomId = null;

let roomCode = null;

let isHost = false;

let myColor = null;


// =====================================
// DOM
// =====================================

const boardElement =
    document.getElementById("board");

const statusElement =
    document.getElementById("status");

const turnText =
    document.getElementById("turnText");

const gameModeText =
    document.getElementById("gameMode");

const modeMenu =
    document.getElementById("modeMenu");

const onlineMenu =
    document.getElementById("onlineMenu");

const localMenu =
    document.getElementById("localMenu");

const roomInfo =
    document.getElementById("roomInfo");

const roomCodeElement =
    document.getElementById("roomCode");

const localInfo =
    document.getElementById("localInfo");

const onlineInfo =
    document.getElementById("onlineInfo");


// =====================================
// 보드 생성
// =====================================

function createBoard() {

    boardElement.innerHTML = "";

    board = [];

    for (let y = 0; y < SIZE; y++) {

        board[y] = [];

        for (let x = 0; x < SIZE; x++) {

            board[y][x] = null;

            const cell =
                document.createElement("div");

            cell.className = "cell";

            cell.dataset.x = x;
            cell.dataset.y = y;

            cell.addEventListener(
                "click",
                () => {

                    handleCellClick(
                        x,
                        y
                    );

                }
            );

            boardElement.appendChild(cell);
        }
    }
}


// =====================================
// 셀 클릭
// =====================================

function handleCellClick(x, y) {

    if (gameMode === "local") {

        placeLocalStone(x, y);

        return;
    }


    if (gameMode === "online") {

        placeOnlineStone(x, y);

        return;
    }

}


// =====================================
// 로컬 2인 대전
// =====================================

document
    .getElementById("localModeBtn")
    .addEventListener(
        "click",
        startLocalGame
    );


function startLocalGame() {

    gameMode = "local";

    modeMenu.classList.add("hidden");

    onlineMenu.classList.add("hidden");

    roomInfo.classList.add("hidden");

    localMenu.classList.remove("hidden");

    localInfo.classList.remove("hidden");

    onlineInfo.classList.add("hidden");

    createBoard();

    resetGame(false);

    gameModeText.textContent =
        "모드: 👥 2인 대전";

    statusElement.textContent =
        "⚫ 흑부터 시작합니다.";

    updateInfo();

}


// =====================================
// 로컬 돌 놓기
// =====================================

function placeLocalStone(x, y) {

    if (gameOver) return;

    if (board[y][x] !== null) return;


    board[y][x] = currentTurn;

    lastMove = {
        x: x,
        y: y
    };


    renderBoard();


    // 승리
    if (
        checkWin(
            x,
            y,
            currentTurn
        )
    ) {

        gameOver = true;

        renderBoard();

        statusElement.textContent =
            currentTurn === "black"
                ? "🎉 흑 승리!"
                : "🎉 백 승리!";

        updateInfo();

        return;
    }


    // 무승부
    if (isBoardFull()) {

        gameOver = true;

        statusElement.textContent =
            "🤝 무승부!";

        updateInfo();

        return;
    }


    // 차례 변경
    currentTurn =
        currentTurn === "black"
            ? "white"
            : "black";


    updateInfo();

}


// =====================================
// 온라인 모드
// =====================================

document
    .getElementById("onlineModeBtn")
    .addEventListener(
        "click",
        showOnlineMenu
    );


function showOnlineMenu() {

    modeMenu.classList.add("hidden");

    onlineMenu.classList.remove("hidden");

    localMenu.classList.add("hidden");

    roomInfo.classList.add("hidden");

    localInfo.classList.add("hidden");

    onlineInfo.classList.remove("hidden");

    gameMode = "none";

    statusElement.textContent =
        "방을 만들거나 참가하세요.";

}


// =====================================
// 온라인 방 만들기
// =====================================

document
    .getElementById("createBtn")
    .addEventListener(
        "click",
        createRoom
    );


function createRoom() {

    isHost = true;

    gameMode = "online";

    statusElement.textContent =
        "방을 생성하는 중...";


    roomCode =
        Math.random()
            .toString(36)
            .substring(2, 8)
            .toUpperCase();


    roomId =
        "gomoku-" + roomCode;


    peer =
        new Peer(roomId);


    peer.on(
        "open",
        () => {

            myColor = "black";

            roomCodeElement.textContent =
                roomCode;

            onlineMenu.classList.add(
                "hidden"
            );

            roomInfo.classList.remove(
                "hidden"
            );

            createBoard();

            resetGame(false);

            statusElement.textContent =
                "친구가 참가하기를 기다리는 중...";

            updateInfo();

        }
    );


    peer.on(
        "connection",
        conn => {

            connection = conn;

            setupConnection();

        }
    );


    peer.on(
        "error",
        err => {

            console.error(err);

            statusElement.textContent =
                "연결 오류: " + err.type;

        }
    );

}


// =====================================
// 온라인 방 참가
// =====================================

document
    .getElementById("joinBtn")
    .addEventListener(
        "click",
        joinRoom
    );


function joinRoom() {

    const code =
        document
            .getElementById("roomInput")
            .value
            .trim()
            .toUpperCase();


    if (!code) {

        alert(
            "방 코드를 입력하세요."
        );

        return;
    }


    isHost = false;

    gameMode = "online";

    roomCode = code;

    roomId =
        "gomoku-" + code;


    statusElement.textContent =
        "방에 연결하는 중...";


    peer =
        new Peer();


    peer.on(
        "open",
        () => {

            connection =
                peer.connect(roomId);

            setupConnection();

        }
    );


    peer.on(
        "error",
        err => {

            console.error(err);

            statusElement.textContent =
                "방에 연결할 수 없습니다.";

        }
    );

}


// =====================================
// 온라인 연결
// =====================================

function setupConnection() {

    connection.on(
        "open",
        () => {

            onlineMenu.classList.add(
                "hidden"
            );

            roomInfo.classList.remove(
                "hidden"
            );

            localMenu.classList.add(
                "hidden"
            );


            if (!isHost) {

                myColor = "white";

            }


            createBoard();

            resetGame(false);


            statusElement.textContent =
                "🎮 상대방과 연결되었습니다!";


            updateInfo();

        }
    );


    connection.on(
        "data",
        data => {

            handleNetworkData(data);

        }
    );


    connection.on(
        "close",
        () => {

            statusElement.textContent =
                "상대방의 연결이 끊어졌습니다.";

        }
    );


    connection.on(
        "error",
        err => {

            console.error(err);

        }
    );

}


// =====================================
// 온라인 돌 놓기
// =====================================

function placeOnlineStone(x, y) {

    if (gameOver) return;

    if (board[y][x] !== null) return;


    if (
        !connection ||
        !connection.open
    ) {

        statusElement.textContent =
            "상대방과 연결되지 않았습니다.";

        return;
    }


    if (currentTurn !== myColor) {

        statusElement.textContent =
            "상대방의 차례입니다.";

        return;
    }


    board[y][x] = currentTurn;

    lastMove = {
        x: x,
        y: y
    };


    renderBoard();


    const won =
        checkWin(
            x,
            y,
            currentTurn
        );


    const draw =
        !won &&
        isBoardFull();


    send({
        type: "move",
        x: x,
        y: y,
        color: currentTurn,
        won: won,
        draw: draw
    });


    if (won) {

        gameOver = true;

        statusElement.textContent =
            "🎉 당신의 승리!";

        updateInfo();

        return;
    }


    if (draw) {

        gameOver = true;

        statusElement.textContent =
            "🤝 무승부!";

        updateInfo();

        return;
    }


    currentTurn =
        currentTurn === "black"
            ? "white"
            : "black";


    updateInfo();

}


// =====================================
// 네트워크 데이터
// =====================================

function handleNetworkData(data) {

    if (!data) return;


    if (data.type === "move") {

        if (board[data.y][data.x] !== null) {
            return;
        }


        board[data.y][data.x] =
            data.color;


        lastMove = {
            x: data.x,
            y: data.y
        };


        renderBoard();


        if (data.won) {

            gameOver = true;

            statusElement.textContent =
                "😢 상대방의 승리!";

            updateInfo();

            return;
        }


        if (data.draw) {

            gameOver = true;

            statusElement.textContent =
                "🤝 무승부!";

            updateInfo();

            return;
        }


        currentTurn =
            currentTurn === "black"
                ? "white"
                : "black";


        updateInfo();

        return;
    }


    if (data.type === "reset") {

        resetGame(false);

        return;
    }

}


// =====================================
// 승리 판정
// =====================================

function checkWin(
    x,
    y,
    color
) {

    const directions = [

        [1, 0],

        [0, 1],

        [1, 1],

        [1, -1]

    ];


    for (
        const [dx, dy]
        of directions
    ) {

        let count = 1;


        count += countDirection(
            x,
            y,
            dx,
            dy,
            color
        );


        count += countDirection(
            x,
            y,
            -dx,
            -dy,
            color
        );


        if (count >= 5) {

            return true;

        }

    }


    return false;

}


function countDirection(
    x,
    y,
    dx,
    dy,
    color
) {

    let count = 0;


    let nx = x + dx;

    let ny = y + dy;


    while (

        nx >= 0 &&
        nx < SIZE &&
        ny >= 0 &&
        ny < SIZE &&
        board[ny][nx] === color

    ) {

        count++;

        nx += dx;

        ny += dy;

    }


    return count;

}


// =====================================
// 무승부 판정
// =====================================

function isBoardFull() {

    for (
        let y = 0;
        y < SIZE;
        y++
    ) {

        for (
            let x = 0;
            x < SIZE;
            x++
        ) {

            if (
                board[y][x] === null
            ) {

                return false;

            }

        }

    }


    return true;

}


// =====================================
// 보드 렌더링
// =====================================

function renderBoard() {

    const cells =
        boardElement.children;


    for (
        let y = 0;
        y < SIZE;
        y++
    ) {

        for (
            let x = 0;
            x < SIZE;
            x++
        ) {

            const index =
                y * SIZE + x;


            const cell =
                cells[index];


            cell.innerHTML = "";

            cell.classList.remove(
                "last"
            );


            if (
                board[y][x]
            ) {

                const stone =
                    document.createElement(
                        "div"
                    );


                stone.className =
                    "stone " +
                    (
                        board[y][x] === "black"
                            ? "black"
                            : "white"
                    );


                if (
                    lastMove &&
                    lastMove.x === x &&
                    lastMove.y === y
                ) {

                    stone.classList.add(
                        "last"
                    );

                }


                cell.appendChild(
                    stone
                );

            }

        }

    }

}


// =====================================
// 정보 표시
// =====================================

function updateInfo() {

    if (
        gameMode === "none"
    ) {

        gameModeText.textContent =
            "모드: -";

        turnText.textContent =
            "차례: -";

        return;
    }


    turnText.textContent =
        "차례: " +
        (
            currentTurn === "black"
                ? "⚫ 흑"
                : "⚪ 백"
        );


    if (
        gameMode === "local"
    ) {

        if (!gameOver) {

            statusElement.textContent =
                currentTurn === "black"
                    ? "⚫ 흑의 차례입니다."
                    : "⚪ 백의 차례입니다.";

        }

        return;
    }


    if (
        gameMode === "online"
    ) {

        if (!myColor) return;


        if (!gameOver) {

            if (
                currentTurn === myColor
            ) {

                statusElement.textContent =
                    "🎯 당신의 차례입니다.";

            } else {

                statusElement.textContent =
                    "상대방의 차례입니다.";

            }

        }

    }

}


// =====================================
// 게임 리셋
// =====================================

function resetGame(sendNetwork) {

    board = [];

    for (
        let y = 0;
        y < SIZE;
        y++
    ) {

        board[y] = [];

        for (
            let x = 0;
            x < SIZE;
            x++
        ) {

            board[y][x] = null;

        }

    }


    currentTurn = "black";

    gameOver = false;

    lastMove = null;


    renderBoard();

    updateInfo();


    if (
        sendNetwork &&
        gameMode === "online"
    ) {

        send({
            type: "reset"
        });

    }

}


// =====================================
// 로컬 새 게임
// =====================================

document
    .getElementById("localNewGameBtn")
    .addEventListener(
        "click",
        () => {

            resetGame(false);

        }
    );


// =====================================
// 온라인 새 게임
// =====================================

document
    .getElementById("onlineNewGameBtn")
    .addEventListener(
        "click",
        () => {

            resetGame(true);

        }
    );


// =====================================
// 코드 복사
// =====================================

document
    .getElementById("copyBtn")
    .addEventListener(
        "click",
        async () => {

            const code =
                roomCodeElement.textContent;


            try {

                await navigator.clipboard
                    .writeText(code);


                statusElement.textContent =
                    "방 코드가 복사되었습니다.";

            }
            catch {

                alert(
                    "방 코드: " + code
                );

            }

        }
    );


// =====================================
// 모드 선택으로 돌아가기
// =====================================

document
    .getElementById("backFromOnlineBtn")
    .addEventListener(
        "click",
        backToModeMenu
    );


document
    .getElementById("backFromRoomBtn")
    .addEventListener(
        "click",
        backToModeMenu
    );


document
    .getElementById("backFromLocalBtn")
    .addEventListener(
        "click",
        backToModeMenu
    );


function backToModeMenu() {

    if (connection) {

        try {
            connection.close();
        }
        catch {}

    }


    if (peer) {

        try {
            peer.destroy();
        }
        catch {}

    }


    connection = null;

    peer = null;

    roomId = null;

    roomCode = null;

    myColor = null;

    gameMode = "none";


    modeMenu.classList.remove(
        "hidden"
    );

    onlineMenu.classList.add(
        "hidden"
    );

    localMenu.classList.add(
        "hidden"
    );

    roomInfo.classList.add(
